<!DOCTYPE html>
<html lang="en">
<head>
	<title>Apoapsis</title>
	<meta charset="utf-8">
	<link rel="stylesheet" href="/style.css">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="author" content="GitHub@RedReaper420, GitHub@Vector-Graphics">
	<script type="module" src="/js/main.js"></script>
</head>

<body>
	<header>
		<div class="tab">
			<button class="tablinks btn" data-tab="btn" id="btn-generate">Generate system</button>
			<button class="tablinks" data-tab="tab_generator">Generator settings</button>
			<button class="tablinks btn" data-tab="btn" id="btn-download-system">Download SOLAR file</button>
			<button class="tablinks btn" data-tab="btn" id="btn-upload-system">Upload SOLAR file</button>
			<button class="tablinks" data-tab="tab_editor">JSON Editor</button>
		</div>
		<div class="tabcontent" id="tab_generator">
			<p>
				<label  for="gen_seed">Seed:</label>
				<input name="gen_seed" type="text" 
						 id="gen_seed" autocomplete="off">
			</p>

			<hr>

			<p>
				<label  for="gen_star_binary_chance">Binary star chance:</label>
				<input name="gen_star_binary_chance" type="number" 
						 id="gen_star_binary_chance" step="0.1">
			</p>

			<p>
				<label  for="gen_star_mass_use_imf">Use IMF:</label>
				<input name="gen_star_mass_use_imf" type="checkbox" 
						 id="gen_star_mass_use_imf">
			</p>
			
			<p>
				<label  for="gen_star_mass_min">Minimum star mass:</label>
				<input name="gen_star_mass_min" type="number" 
						 id="gen_star_mass_min" step="0.1">
			</p>

			<p>
				<label  for="gen_star_mass_max">Maximum star mass:</label>
				<input name="gen_star_mass_max" type="number" 
						 id="gen_star_mass_max" step="0.1">
			</p>

			<p>
				<label  for="gen_star_metallicity_min">Minimum star metallicity:</label>
				<input name="gen_star_metallicity_min" type="number" 
						 id="gen_star_metallicity_min" step="0.1">
			</p>

			<p>
				<label  for="gen_star_metallicity_max">Maximum star metallicity:</label>
				<input name="gen_star_metallicity_max" type="number" 
						 id="gen_star_metallicity_max" step="0.1">
			</p>

			<p>
				<label  for="gen_star_metallicity_use_gaussian">Use gaussian distribution:</label>
				<input name="gen_star_metallicity_use_gaussian" type="checkbox" 
						 id="gen_star_metallicity_use_gaussian">
			</p>

			<p>
				<label  for="gen_star_metallicity_mean">Mean star metallicity:</label>
				<input name="gen_star_metallicity_mean" type="number" 
						 id="gen_star_metallicity_mean" step="0.05">
			</p>

			<p>
				<label  for="gen_star_metallicity_std">Standard deviation for star metallicity:</label>
				<input name="gen_star_metallicity_std" type="number" 
						 id="gen_star_metallicity_std" step="0.05">
			</p>

			<hr>

			<p>
				<label  for="gen_planet_amount_multiplier">Planet amount multiplier:</label>
				<input name="gen_planet_amount_multiplier" type="number" 
						 id="gen_planet_amount_multiplier" step="0.1">
			</p>

			<p>
				<label  for="gen_planet_s_type_safety_factor">S-type orbits safety factor:</label>
				<input name="gen_planet_s_type_safety_factor" type="number" 
						 id="gen_planet_s_type_safety_factor" step="0.1">
			</p>

			<p>
				<label  for="gen_planet_p_type_enabled">Enable P-type orbits:</label>
				<input name="gen_planet_p_type_enabled" type="checkbox" 
						 id="gen_planet_p_type_enabled">
			</p>

			<p>
				<label  for="gen_planet_p_type_safety_factor">P-type orbits safety factor:</label>
				<input name="gen_planet_p_type_safety_factor" type="number" 
						 id="gen_planet_p_type_safety_factor" step="0.1">
			</p>

			<p>
				<label  for="gen_planet_migration_type_1_enabled">Enable Type I migration:</label>
				<input name="gen_planet_migration_type_1_enabled" type="checkbox" 
						 id="gen_planet_migration_type_1_enabled">
			</p>
			<p>
				<label  for="gen_planet_migration_type_1_coeff">Type I migration coefficient:</label>
				<input name="gen_planet_migration_type_1_coeff" type="number" 
						 id="gen_planet_migration_type_1_coeff" step="0.1">
			</p>

			<p>
				<label  for="gen_planet_migration_type_2_enabled">Enable Type II migration:</label>
				<input name="gen_planet_migration_type_2_enabled" type="checkbox" 
						 id="gen_planet_migration_type_2_enabled">
			</p>

			<p>
				<label  for="gen_planet_migration_type_2_coeff">Type II migration coefficient:</label>
				<input name="gen_planet_migration_type_2_coeff" type="number" 
						 id="gen_planet_migration_type_2_coeff" step="0.1">
			</p>

			<p>
				<label  for="gen_planet_migration_interpolated">Interpolate migration regimes:</label>
				<input name="gen_planet_migration_interpolated" type="checkbox" 
						 id="gen_planet_migration_interpolated">
			</p>

			<p>
				<label  for="gen_planet_migration_grand_tack_enabled">Enable Grand Tack:</label>
				<input name="gen_planet_migration_grand_tack_enabled" type="checkbox" 
						 id="gen_planet_migration_grand_tack_enabled">
			</p>

			<p>
				<label  for="gen_planet_migration_hill_safety_factor">Hill orbit safety factor:</label>
				<input name="gen_planet_migration_hill_safety_factor" type="number" 
						 id="gen_planet_migration_hill_safety_factor" step="0.1">
			</p>
		</div>
		<div class="tabcontent" id="tab_editor">
			<p>
				<textarea class="json-editor" cols="60" rows="30"></textarea>
			</p>
			<p>
				<button>Update system</button>
			</p>
		</div>
	</header>

	<main>
		<div class="system-info"></div>
		<div class="system-display">
			<div id="ui-panel">
				<div class="control-group">
					<label for="warpSlider">Time Acceleration (Warp Factor)</label>
					<input type="range" id="warpSlider" min="0" max="8" step="0.1" value="4.5">
					<div style="font-size: 11px; text-align: right; color: #888;">
						Speed: <span id="warpDisplay" class="val">1 day/sec</span>
					</div>
				</div>
				<div id="stats">
					<div>Star: <span id="starNameDisplay" class="val">-</span> (<span id="starMassDisplay" class="val">1.0</span> M☉)</div>
					<div>Total Bodies: <span id="totalCountDisplay" class="val">0</span></div>
					<div>System Radius: <span id="maxRadiusDisplay" class="val">0</span> AU</div>
					<div id="instructions">Click a body to track/zoom. Click empty space to reset view.</div>
				</div>
			</div>
			<canvas id="simCanvas"></canvas>
		</div>
	</main>

	<footer>
		<span><b><a target="_blank" href="https://github.com/RedReaper420/apoapsis">Apoapsis</a></b> by RedReaper420 is inspired with <b><a target="_blank" href="https://github.com/Vector-Graphics/periapsis">Periapsis</a></b> by Vector-Graphics.</span>
	</footer>
</body>
</html>
